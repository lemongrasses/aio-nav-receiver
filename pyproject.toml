[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aio-nav-receiver"
description = "Receives AIO NAV 0x04 navigation and 0x05 status UDP packets and shows whether the navigation may be used"
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version"]
dependencies = []                     # standard library only, so the portable build stays small

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.8", "pyinstaller>=6"]

[project.scripts]
aio-receiver = "aio_receiver.cli:main"

[tool.setuptools.dynamic]
version = { attr = "aio_receiver.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",     # the UI is Chinese: full-width punctuation is intended
    "SIM105",                         # explicit try/except/pass reads better at the OS boundary
    "UP006", "UP007", "UP035", "UP045",  # Python 3.9 floor: keep typing.Optional / List throughout
]

[tool.mypy]
python_version = "3.9"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["aio_receiver.core.*", "aio_receiver.io.*", "aio_receiver.engine", "aio_receiver.analysis",
          "aio_receiver.config"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
