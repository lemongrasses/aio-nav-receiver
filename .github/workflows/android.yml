name: android

on:
  push:
    branches: [main]
    paths: ["android/**", "fixtures/**", "tools/make_gate_vectors.py", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "fixtures/**", "tools/make_gate_vectors.py", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # The unit tests read ../fixtures from the checkout (the desktop and iOS apps test against the same files).
      - name: assembleDebug testDebugUnitTest
        run: ./gradlew assembleDebug testDebugUnitTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: android/app/build/reports/tests/testDebugUnitTest/
      - uses: actions/upload-artifact@v4
        with:
          name: aio-nav-monitor-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
