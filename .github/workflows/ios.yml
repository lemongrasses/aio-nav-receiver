name: ios

on:
  push:
    branches: [main]
    paths: ["ios/**", "fixtures/**", "src/aio_receiver/i18n.py", "tools/make_gate_vectors.py", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", "fixtures/**", "src/aio_receiver/i18n.py", "tools/make_gate_vectors.py", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: build + test (iOS Simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1      # the app needs the iOS 26 SDK (Xcode 26)
        with:
          xcode-version: latest-stable
      - name: pick an iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in sorted(devices.items(), reverse=True) if ".iOS-" in runtime
                     for d in ds if d["name"].startswith("iPhone")))')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      # The tests read ../fixtures from the checkout, so they need no copy of the shared files.
      - name: xcodebuild test
        run: |
          xcodebuild test -project ios/MyApp.xcodeproj -scheme MyApp \
            -destination "id=${{ steps.sim.outputs.udid }}" CODE_SIGNING_ALLOWED=NO
