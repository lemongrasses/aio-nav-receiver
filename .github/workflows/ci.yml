name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: lint + types
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests tools
      - run: mypy

  test:
    name: test ${{ matrix.os }} py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
        python: ["3.9", "3.12"]
        exclude:
          - os: macos-latest            # no 3.9 build for Apple silicon runners; the floor is covered elsewhere
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: pytest (Linux needs a virtual display for the window tests)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          xvfb-run -a pytest -q
      - name: pytest
        if: runner.os != 'Linux'
        run: pytest -q

  build:
    name: build ${{ matrix.os }}
    needs: [check, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: AIO_NAV_Receiver-windows-x64
          - os: ubuntu-22.04              # oldest glibc we build on = widest Linux compatibility
            artifact: aio-nav-receiver-linux-x64
          - os: macos-latest              # Apple silicon
            artifact: AIO_NAV_Receiver-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python scripts/build.py --fast
      - name: smoke test the build
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) ls -l dist/AIO_NAV_Receiver.exe ;;
            Linux)   ./dist/aio-nav-receiver --version ;;
            macOS)   "./dist/AIO NAV Receiver.app/Contents/MacOS/AIO NAV Receiver" --version ;;
          esac
      # Archives keep the executable bit, which artifact upload alone would drop.
      - name: package
        shell: bash
        run: |
          mkdir -p out
          case "${{ runner.os }}" in
            Windows) cp dist/AIO_NAV_Receiver.exe out/ ;;
            Linux)   tar -C dist -czf out/${{ matrix.artifact }}.tar.gz aio-nav-receiver ;;
            macOS)   ditto -c -k --keepParent "dist/AIO NAV Receiver.app" out/${{ matrix.artifact }}.zip ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
